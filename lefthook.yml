pre-commit:
    jobs:
        - name: format
          glob: "*.{js,jsx,ts,tsx,json,css,md,yml,yaml}"
          run: npx oxfmt --no-error-on-unmatched-pattern {staged_files}
          stage_fixed: true
        - name: lint
          glob: "*.{js,jsx,ts,tsx}"
          run: npx oxlint {staged_files}
        - name: lint-design
          glob: "DESIGN.md"
          run: npm run lint:design
        - name: typecheck
          run: npm run typecheck
